<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out Safely</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes drawCheck {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .animate-scale { animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: drawCheck 0.5s 0.3s ease-in-out forwards; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100 max-w-sm w-full text-center flex flex-col items-center">
        <!-- Animated Green Circle & Tick -->
        <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mb-5 animate-scale">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path class="animate-check" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <!-- Logout Status -->
        <h2 class="text-xl font-bold text-gray-800 mb-2">Logged Out Safely</h2>
        <p class="text-sm text-gray-500 mb-6">Your session has been closed securely.</p>

        <!-- Redirecting Indicator -->
        <div class="flex items-center gap-2 text-xs text-gray-400 bg-gray-50 px-4 py-2 rounded-full border border-gray-100">
            <svg class="animate-spin h-3 w-3 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Redirecting to login...
        </div>
    </div>

    <script>
        // 2 second delay before redirecting back to login
        setTimeout(function() {
            window.location.href = '/login';
        }, 2000);
    </script>
</body>
</html>
